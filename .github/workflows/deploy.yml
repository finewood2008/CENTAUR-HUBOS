name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          # 创建 SDK stub（本地 file: 依赖在 CI 上不存在）
          for pkg in core-sdk product-sdk runtime-sidecar; do
            mkdir -p /tmp/qeeclaw-stubs/$pkg
            echo '{"name":"@qeeclaw/'$pkg'","version":"0.0.0-stub","main":"index.js"}' > /tmp/qeeclaw-stubs/$pkg/package.json
            echo 'module.exports = {};' > /tmp/qeeclaw-stubs/$pkg/index.js
          done
          # 替换 file: 引用为 stub 路径
          sed -i 's|"file:../qeeclaw-sdk/packages/core-sdk"|"file:/tmp/qeeclaw-stubs/core-sdk"|g' package.json
          sed -i 's|"file:../qeeclaw-sdk/packages/product-sdk"|"file:/tmp/qeeclaw-stubs/product-sdk"|g' package.json
          sed -i 's|"file:../qeeclaw-sdk/packages/runtime-sidecar"|"file:/tmp/qeeclaw-stubs/runtime-sidecar"|g' package.json
          npm install --ignore-scripts

      - name: Build
        run: npx vite build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
