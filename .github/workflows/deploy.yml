name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # SDK 是本地 file: 引用，CI 上不存在
      # 创建 stub 包让 npm ci 通过
      - name: Stub local SDK packages
        run: |
          for pkg in core-sdk product-sdk runtime-sidecar; do
            mkdir -p ../qeeclaw-sdk/packages/$pkg
            echo '{"name":"@qeeclaw/'$pkg'","version":"0.0.0","main":"index.js"}' > ../qeeclaw-sdk/packages/$pkg/package.json
            echo 'module.exports = new Proxy({}, { get: () => () => ({}) });' > ../qeeclaw-sdk/packages/$pkg/index.js
          done

      - run: npm install --ignore-scripts
      - run: npx vite build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
